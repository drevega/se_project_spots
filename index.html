<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="Andrea Vega"/><meta name="description" content="spots"/><meta name="keywords" content="places to see and visit"/><link rel="shortcut icon" href="./favicon.ico" type="image/x-icon"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="8650253b58b46f0f1c06.svg" alt="Spots logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><img src="04c411e519a1c6561568.jpg" alt="picture of Bessie Coleman" class="profile__avatar"/><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-button"><img src="5c2584faa41177b41691.svg" alt="pencil icon"/>Edit Profile</button></div><button type="button" class="profile__new-button"><img src="40608da7369d39bc1077.svg" alt="plus icon"/>New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button class="card__delete-button" type="button"></button> <img class="card__image" src="#" alt=""/><div class="card__content"><h2 class="card__title"></h2><button class="card__like-button" type="button"></button></div></li></template></ul></section></main><footer class="footer"><p>2025 © Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-button"><img src="c61ec1048ba18ed3e9f2.svg" alt="x-icon"/></button><h2 class="modal__title">Edit profile</h2><form class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span class="modal__error" id="profile-name-input-error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span class="modal__error" id="profile-description-input-error"></span></label> <button type="submit" class="modal__submit-button modal__button_disabled">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-button"><img src="c61ec1048ba18ed3e9f2.svg" alt="x-icon"/></button><h2 class="modal__title">New post</h2><form class="modal__form" novalidate><label for="card-image-input" class="modal__label">Image link <input id="card-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span class="modal__error" id="card-image-input-error"></span></label> <label for="image-caption-input" class="modal__label">Caption <input id="image-caption-input" class="modal__input" placeholder="Add a caption" minlength="2" maxlength="30" required/> <span class="modal__error" id="image-caption-input-error"></span></label> <button type="submit" class="modal__submit-button modal__button_disabled">Save</button></form></div></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__image-caption"><button type="button" class="modal__close-button modal__close-button_type_preview"><img src="1c517008152856bd3203.svg" alt="close-icon"/></button> <img src="#" alt="" class="modal__image"/><p class="modal__caption"></p></div></div></body></html>
